<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spindle Record</title>
<meta name="description" content="A record sconce in three.js. Drag to tilt it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1d1a17;
    --ink: #f4eee6;
    --muted: rgba(244,238,230,.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .hud { position: fixed; left: 0; right: 0; pointer-events: none; padding: 16px max(16px, env(safe-area-inset-left)); }
  .top { top: 0; padding-top: max(16px, env(safe-area-inset-top)); }
  .bottom { bottom: 0; padding-bottom: max(22px, env(safe-area-inset-bottom)); text-align: center; }
  h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(28px, 6vw, 44px); margin: 0; line-height: 1; }
  h1 em { font-style: italic; opacity: .7; }
  .hint { font-size: 13px; color: var(--muted); letter-spacing: .03em; transition: opacity 1s; }
  .fallback { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud top"><h1>Spindle <em>no. IV</em></h1></div>
<div class="hud bottom"><span class="hint" id="hint">drag the record to tilt it</span></div>
<div class="fallback" id="fallback">This one needs WebGL. Try it in Safari or Chrome.</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) { document.getElementById('fallback').style.display = 'grid'; throw e; }
const mobile = matchMedia('(pointer: coarse)').matches;
const PR = Math.min(Math.max(devicePixelRatio, 1) * 1.5, 3); // supersampled so circle edges stay clean
renderer.setPixelRatio(PR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.03).texture;

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

// ---------- dimensions (12 in record scaled so radius = 1.5) ----------
const R = 1.5, LABEL_R = 0.5, THICK = 0.016, STANDOFF = 0.34;

// ---------- the wall ----------
const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: '#8a8178', roughness: 0.92, metalness: 0, envMapIntensity: 0.4 })
);
wall.receiveShadow = true;
scene.add(wall);

// warm halo the LED ring throws on the wall
function haloTex() {
  const N = 512, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'), m = N / 2;
  const grd = g.createRadialGradient(m, m, 0, m, m, m);
  grd.addColorStop(0.00, 'rgba(255,170,80,0.0)');
  grd.addColorStop(0.42, 'rgba(255,170,80,0.55)');
  grd.addColorStop(0.50, 'rgba(255,190,110,1.0)');
  grd.addColorStop(0.62, 'rgba(255,150,60,0.45)');
  grd.addColorStop(0.80, 'rgba(255,130,50,0.12)');
  grd.addColorStop(1.00, 'rgba(255,120,40,0.0)');
  g.fillStyle = grd; g.fillRect(0, 0, N, N);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const halo = new THREE.Mesh(
  new THREE.PlaneGeometry(R * 3.1, R * 3.1),
  new THREE.MeshBasicMaterial({ map: haloTex(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.62 })
);
halo.position.z = 0.002;
scene.add(halo);

// ---------- lights ----------
const key = new THREE.SpotLight('#fff1e0', 34, 30, Math.PI / 5, 1.0, 1.4); // overhead, soft edge
key.position.set(0, 9.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 14;
key.shadow.blurSamples = 24;
key.shadow.bias = -0.0004;
scene.add(key, key.target);
const ledRing = new THREE.PointLight('#ffae5a', 3.6, 4, 1.6); // the strip, behind the disc
ledRing.position.set(0, 0, STANDOFF * 0.5);
scene.add(ledRing);
scene.add(new THREE.HemisphereLight('#fff4ea', '#2a2420', 0.32));

// ---------- the record ----------
const sconce = new THREE.Group();          // pivots about the center post
sconce.position.z = STANDOFF;
scene.add(sconce);

const TEX = Math.min(mobile ? 3072 : 4096, renderer.capabilities.maxTextureSize);
function vinylFace(labelImg) {
  const c = document.createElement('canvas'); c.width = c.height = TEX;
  const g = c.getContext('2d'), m = TEX / 2, px = m / R;
  g.fillStyle = '#0b0b0c'; g.beginPath(); g.arc(m, m, m, 0, 7); g.fill();
  // grooves, with gaps between the four songs on side two
  const gaps = [0.62, 0.86, 1.10];
  for (let r = LABEL_R + 0.09; r < R - 0.04; r += 0.0036) {
    const inGap = gaps.some(gp => Math.abs(r - gp) < 0.012);
    g.strokeStyle = inGap ? 'rgba(255,255,255,0.10)' : `rgba(255,255,255,${0.018 + Math.random() * 0.03})`;
    g.lineWidth = TEX / 2048; g.beginPath(); g.arc(m, m, r * px, 0, 7); g.stroke();
  }
  // printed label, clipped to its circle
  g.save(); g.beginPath(); g.arc(m, m, LABEL_R * px, 0, 7); g.clip();
  const lw = LABEL_R * px * 2 / 0.965; // the photo's label edge sits just inside the frame
  g.drawImage(labelImg, m - lw / 2, m - lw / 2, lw, lw);
  g.restore();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
// groove direction (tangent of each circle) + strength, for the light streak that slides when it tilts
function grooveAniso() {
  const N = 512, d = new Uint8Array(N * N * 4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = (x + .5) / N * 2 - 1, v = (y + .5) / N * 2 - 1, l = Math.hypot(u, v) || 1, r = l * R;
    const i = (y * N + x) * 4;
    d[i] = (-v / l * .5 + .5) * 255; d[i + 1] = (-(u / l) * .5 + .5) * 255;
    d[i + 2] = (r > LABEL_R + 0.06 && r < R - 0.03) ? 255 : 0; d[i + 3] = 255;
  }
  const t = new THREE.DataTexture(d, N, N); t.needsUpdate = true; t.magFilter = THREE.LinearFilter; return t;
}
function roughMap() {
  const N = 512, d = new Uint8Array(N * N * 4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const r = Math.hypot((x + .5) / N * 2 - 1, (y + .5) / N * 2 - 1) * R;
    const i = (y * N + x) * 4;
    const val = r < LABEL_R ? 0.75 : r < LABEL_R + 0.08 ? 0.22 : 0.32; // matte paper, glossy runout, grooves
    d[i] = d[i + 1] = d[i + 2] = val * 255; d[i + 3] = 255;
  }
  const t = new THREE.DataTexture(d, N, N); t.needsUpdate = true; t.magFilter = THREE.LinearFilter; return t;
}

const faceMat = new THREE.MeshPhysicalMaterial({
  color: '#ffffff', roughness: 1, roughnessMap: roughMap(), metalness: 0,
  anisotropy: 0.7, anisotropyMap: grooveAniso(),
  envMapIntensity: 0.55,
});
const face = new THREE.Mesh(new THREE.CircleGeometry(R, 512), faceMat);
face.position.z = THICK / 2;
face.castShadow = true;
sconce.add(face);
const edge = new THREE.Mesh(
  new THREE.CylinderGeometry(R, R, THICK, 512, 1, true),
  new THREE.MeshPhysicalMaterial({ color: '#0d0d0e', roughness: 0.3, clearcoat: 0.5 })
);
edge.rotation.x = Math.PI / 2;
edge.castShadow = true;
sconce.add(edge);
const back = new THREE.Mesh(new THREE.CircleGeometry(R, 256), new THREE.MeshStandardMaterial({ color: '#0b0b0c', roughness: 0.4 }));
back.rotation.y = Math.PI; back.position.z = -THICK / 2; back.castShadow = true;
sconce.add(back);

// chrome dome cap on a thin bezel
const chrome = new THREE.MeshPhysicalMaterial({ color: '#ffffff', metalness: 1, roughness: 0.035, envMapIntensity: 1.5 });
const DOME_R = 0.188, DOME_H = 0.105, RIM_H = 0.03;
const sphR = (DOME_R * DOME_R + DOME_H * DOME_H) / (2 * DOME_H);
const dome = new THREE.Mesh(new THREE.SphereGeometry(sphR, 256, 96, 0, Math.PI * 2, 0, Math.asin(DOME_R / sphR)), chrome);
dome.rotation.x = Math.PI / 2;
dome.position.z = THICK / 2 + RIM_H - (sphR - DOME_H);
dome.castShadow = true;
const rim = new THREE.Mesh(new THREE.CylinderGeometry(DOME_R + 0.004, DOME_R + 0.004, RIM_H, 256), chrome);
rim.rotation.x = Math.PI / 2;
rim.position.z = THICK / 2 + RIM_H / 2;
sconce.add(dome, rim);

new THREE.ImageLoader().load('label.jpg', img => {
  faceMat.map = vinylFace(img);
  faceMat.needsUpdate = true;
});

// ---------- lens: MSAA + focus falls off toward the edges ----------
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const LensBlur = {
  uniforms: { tDiffuse: { value: null }, res: { value: new THREE.Vector2(1, 1) }, focus: { value: 0.16 }, amount: { value: 9.0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 res; uniform float focus, amount; varying vec2 vUv;
    void main(){
      vec2 p = (vUv - 0.5) * vec2(res.x / res.y, 1.0);
      float d = length(p);
      float coc = smoothstep(focus, focus + 0.42, d) * amount; // radius in px, sharp in the middle
      if (coc < 0.25) { gl_FragColor = texture2D(tDiffuse, vUv); return; }
      vec4 acc = vec4(0.0); float wsum = 0.0;
      const float GA = 2.39996323;
      for (int i = 0; i < 48; i++) {
        float fi = float(i);
        float rr = sqrt((fi + 0.5) / 48.0) * coc;
        vec2 off = vec2(cos(fi * GA), sin(fi * GA)) * rr / res;
        acc += texture2D(tDiffuse, vUv + off); wsum += 1.0;
      }
      gl_FragColor = acc / wsum;
    }`,
};
const lens = new ShaderPass(LensBlur);
composer.addPass(lens);
composer.addPass(new OutputPass());

// ---------- framing ----------
function layout() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(PR);
  composer.setSize(w, h);
  lens.uniforms.res.value.set(w * PR, h * PR);
  lens.uniforms.amount.value = 7.0 * PR;
  camera.aspect = w / h;
  const want = R * 2 * (w < h ? 0.84 : 0.96);   // fit the glow inside the shorter side
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  camera.position.set(0, 0, Math.max(want / 2 / tanV, want / 2 / (tanV * camera.aspect)));
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', layout);
layout();

// ---------- interaction: drag to tilt, it springs back ----------
const target = new THREE.Vector2();
const tilt = new THREE.Vector2();
const vel = new THREE.Vector2();
const gyro = new THREE.Vector2();
const goal = new THREE.Vector2();
let dragging = false, start = null, hinted = false, gyroAsked = false;
const MAX = 0.62; // about 35 degrees

function onDown(e) {
  dragging = true;
  start = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
  if (!hinted) { hinted = true; document.getElementById('hint').style.opacity = 0; }
  // iOS asks once, on a tap, before it shares the gyroscope
  if (!gyroAsked && typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    gyroAsked = true;
    DeviceOrientationEvent.requestPermission().catch(() => {});
  }
}
function onMove(e) {
  if (!dragging) return;
  const s = 2.4 / Math.min(innerWidth, innerHeight);
  target.set(
    THREE.MathUtils.clamp((e.clientX - start.x) * s, -MAX, MAX),
    THREE.MathUtils.clamp((e.clientY - start.y) * s, -MAX, MAX)
  );
}
function onUp() { dragging = false; target.set(0, 0); }
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);

addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  gyro.set(THREE.MathUtils.clamp(e.gamma / 45, -1, 1) * 0.18, THREE.MathUtils.clamp((e.beta - 50) / 45, -1, 1) * 0.12);
});

// ---------- loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30), t = clock.elapsedTime;
  goal.copy(target);
  if (!dragging) { goal.add(gyro); goal.x += Math.sin(t * 0.6) * 0.02; }
  const k = dragging ? 140 : 38, damp = dragging ? 22 : 5.5; // snappy while held, a little wobble on release
  vel.x += ((goal.x - tilt.x) * k - vel.x * damp) * dt;
  vel.y += ((goal.y - tilt.y) * k - vel.y * damp) * dt;
  tilt.addScaledVector(vel, dt);

  sconce.rotation.set(tilt.y, tilt.x, 0);
  // lift it off the wall as it tilts, so the far edge never sinks into the drywall
  const ang = Math.min(Math.hypot(tilt.x, tilt.y), 1.2);
  sconce.position.z = Math.max(STANDOFF, R * Math.sin(ang) + 0.08);
  // the edge that lifts off the wall lets more light out
  halo.position.set(-tilt.x * 0.25, tilt.y * 0.25, 0.002);
  halo.material.opacity = 0.62 + Math.min(0.1, (Math.abs(tilt.x) + Math.abs(tilt.y)) * 0.15);
  composer.render();
});
</script>
</body>
</html>
